[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calograph"
version = "0.0.1"
description = "GNN hit clustering on toy calorimeter data"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "torch_geometric"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
